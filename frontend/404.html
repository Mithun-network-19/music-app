<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | AuraSound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-music"></i>
        </div>
        <span>AuraSound</span>
      </a>

      <div class="nav-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle Theme">
          <i class="fa-solid fa-sun"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- 404 Content -->
  <main class="error-page">
    <div class="error-content">
      <div class="error-code">404</div>
      <h1 style="font-size: 2rem; margin-bottom: 15px; font-weight: 800;">Track Not Found</h1>
      <p class="text-muted" style="margin-bottom: 25px; line-height: 1.6;">
        The page or song stream you are looking for has been moved, renamed, or lost in the frequency spectrum.
      </p>
      <a href="index.html" class="btn-primary" style="display: inline-flex;">
        <i class="fa-solid fa-house"></i> Return to Homepage
      </a>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
